name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-dev.lock
      - run: ruff check .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m framebudget.cli demo --synthetic --out reports/ci-demo

  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Headless schema smoke
        env:
          GODOT_PATH: ${{ github.workspace }}/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: python -m unittest tests.integration.test_cli.CliTests.test_real_godot_headless_schema -v
