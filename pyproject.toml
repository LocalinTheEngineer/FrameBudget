[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "framebudget"
version = "0.1.0"
description = "Repeatable Godot frame-time benchmark kit"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
framebudget = "framebudget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
